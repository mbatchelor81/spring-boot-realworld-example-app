# -----------------------------------------------------------------------
# Fluentd configuration for FTGO Platform — Docker Compose (local dev)
# -----------------------------------------------------------------------
# Collects JSON-structured logs from Docker containers via the fluentd
# logging driver and forwards them to Elasticsearch.
# -----------------------------------------------------------------------

# Accept logs from the Docker fluentd logging driver
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Parse the JSON log body emitted by logstash-logback-encoder
<filter ftgo.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error true
  <parse>
    @type json
    time_key @timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
    keep_time_key true
  </parse>
</filter>

# Add the container/service tag as a field
<filter ftgo.**>
  @type record_transformer
  <record>
    fluentd_tag ${tag}
  </record>
</filter>

# Route to Elasticsearch
<match ftgo.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix ftgo-logs
  logstash_dateformat %Y.%m.%d
  include_tag_key true
  tag_key fluentd_tag
  flush_interval 5s
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 5s
    chunk_limit_size 8m
    total_limit_size 512m
    overflow_action block
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

# Catch-all for non-FTGO logs (e.g. Keycloak, infrastructure)
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix infra-logs
  logstash_dateformat %Y.%m.%d
  flush_interval 10s
  <buffer>
    @type memory
    flush_mode interval
    flush_interval 10s
    chunk_limit_size 8m
    total_limit_size 256m
    overflow_action block
  </buffer>
</match>
