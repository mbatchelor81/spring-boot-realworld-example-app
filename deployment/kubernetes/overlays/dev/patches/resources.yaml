apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftgo-consumer-service
spec:
  template:
    spec:
      containers:
        - name: ftgo-consumer-service
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
