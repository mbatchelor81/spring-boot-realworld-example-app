apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-ilm-config
  namespace: logging
data:
  setup-ilm.sh: |
    #!/bin/sh
    set -e
    ES_HOST="${ES_HOST:-http://elasticsearch:9200}"
    until curl -sf "$ES_HOST/_cluster/health" > /dev/null 2>&1; do sleep 5; done

    curl -sSf -X PUT "$ES_HOST/_ilm/policy/ftgo-logs-active" -H 'Content-Type: application/json' -d '{
      "policy": {
        "phases": {
          "hot": { "min_age": "0ms", "actions": {} },
          "warm": { "min_age": "7d", "actions": { "forcemerge": { "max_num_segments": 1 }, "shrink": { "number_of_shards": 1 } } },
          "cold": { "min_age": "30d", "actions": { "allocate": { "number_of_replicas": 0 } } },
          "delete": { "min_age": "90d", "actions": { "delete": {} } }
        }
      }
    }'

    curl -sSf -X PUT "$ES_HOST/_index_template/ftgo-logs" -H 'Content-Type: application/json' -d '{
      "index_patterns": ["ftgo-logs-*"],
      "template": { "settings": { "index.lifecycle.name": "ftgo-logs-active" } }
    }'
