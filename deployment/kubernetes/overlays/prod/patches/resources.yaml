  name: ftgo-mysql
spec:
  template:
    spec:
      containers:
        - name: mysql
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ftgo-mysql-data
spec:
  resources:
    requests:
      storage: 50Gi
