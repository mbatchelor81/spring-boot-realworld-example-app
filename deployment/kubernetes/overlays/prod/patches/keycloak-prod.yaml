apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          args:
            - start
            - --optimized
          env:
            - name: KC_HOSTNAME
              value: ftgo.example.com
            - name: KC_PROXY
              value: edge
            - name: KC_HTTP_ENABLED
              value: "true"
          volumeMounts: []
      volumes: []
