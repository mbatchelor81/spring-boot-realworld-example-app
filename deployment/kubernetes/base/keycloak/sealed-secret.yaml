apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-admin-credentials
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Re-seal with kubeseal for each cluster/environment.
    # Plain-text placeholders:
    #   KEYCLOAK_ADMIN: admin
    #   KEYCLOAK_ADMIN_PASSWORD: <sealed>
    KEYCLOAK_ADMIN: AgA...REPLACE_WITH_SEALED_VALUE
    KEYCLOAK_ADMIN_PASSWORD: AgA...REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: keycloak-admin-credentials
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    type: Opaque
