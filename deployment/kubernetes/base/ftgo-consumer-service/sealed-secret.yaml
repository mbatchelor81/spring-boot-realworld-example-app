apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ftgo-service-db-credentials
  labels:
    app.kubernetes.io/name: ftgo-consumer-service
    app.kubernetes.io/component: service
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Re-seal with kubeseal for each cluster/environment.
    # Plain-text placeholders:
    #   DB_USERNAME: ftgo
    #   DB_PASSWORD: <sealed>
    DB_USERNAME: AgA...REPLACE_WITH_SEALED_VALUE
    DB_PASSWORD: AgA...REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: ftgo-service-db-credentials
      labels:
        app.kubernetes.io/component: service
    type: Opaque
