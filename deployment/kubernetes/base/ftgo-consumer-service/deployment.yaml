apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftgo-consumer-service
  labels:
    app.kubernetes.io/name: ftgo-consumer-service
    app.kubernetes.io/component: service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ftgo-consumer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ftgo-consumer-service
        app.kubernetes.io/component: service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ftgo-consumer-service
          image: ghcr.io/mbatchelor81/ftgo-consumer-service:latest
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://ftgo-mysql:3306/ftgo
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ftgo-service-db-credentials
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ftgo-service-db-credentials
                  key: DB_PASSWORD
            - name: FTGO_SECURITY_JWT_ENABLED
              value: "true"
            - name: FTGO_SECURITY_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: ftgo-consumer-service-config
                  key: KEYCLOAK_ISSUER_URI
            - name: FTGO_SECURITY_JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: ftgo-consumer-service-config
                  key: KEYCLOAK_JWK_SET_URI
          envFrom:
            - configMapRef:
                name: ftgo-consumer-service-config
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
