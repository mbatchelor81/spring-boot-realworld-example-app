apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftgo-api-gateway
  labels:
    app.kubernetes.io/name: ftgo-api-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ftgo-api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ftgo-api-gateway
        app.kubernetes.io/component: gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ftgo-api-gateway
          image: ghcr.io/mbatchelor81/ftgo-api-gateway:latest
          ports:
            - containerPort: 8085
              name: http
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: FTGO_SECURITY_JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: ftgo-api-gateway-config
                  key: KEYCLOAK_ISSUER_URI
            - name: FTGO_SECURITY_JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: ftgo-api-gateway-config
                  key: KEYCLOAK_JWK_SET_URI
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ftgo-api-gateway-config
                  key: REDIS_HOST
          envFrom:
            - configMapRef:
                name: ftgo-api-gateway-config
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
