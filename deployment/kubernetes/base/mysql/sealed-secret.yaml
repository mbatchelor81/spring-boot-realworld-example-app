apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ftgo-mysql-credentials
  labels:
    app.kubernetes.io/name: ftgo-mysql
    app.kubernetes.io/component: database
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Sealed values — re-seal with kubeseal for each cluster/environment.
    # Plain-text placeholders shown for reference only:
    #   MYSQL_ROOT_PASSWORD: <sealed>
    #   MYSQL_PASSWORD: <sealed>
    MYSQL_ROOT_PASSWORD: AgA...REPLACE_WITH_SEALED_VALUE
    MYSQL_PASSWORD: AgA...REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: ftgo-mysql-credentials
      labels:
        app.kubernetes.io/name: ftgo-mysql
        app.kubernetes.io/component: database
    type: Opaque
