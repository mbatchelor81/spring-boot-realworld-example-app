apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluentd
    app.kubernetes.io/component: logging
data:
  fluent.conf: |
    # Collect container logs from /var/log/containers
    <source>
      @type tail
      path /var/log/containers/ftgo-*.log
      pos_file /var/log/fluentd-ftgo-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type json
        time_key time
        time_format %Y-%m-%dT%H:%M:%S.%NZ
        keep_time_key true
      </parse>
    </source>

    # Enrich with Kubernetes metadata (pod name, namespace, labels)
    <filter kubernetes.**>
      @type kubernetes_metadata
      @id filter_kube_metadata
    </filter>

    # Parse the structured JSON log body from logstash-logback-encoder
    <filter kubernetes.**>
      @type parser
      key_name log
      reserve_data true
      remove_key_name_field true
      emit_invalid_record_to_error true
      <parse>
        @type json
        time_key @timestamp
        time_format %Y-%m-%dT%H:%M:%S.%L%z
        keep_time_key true
      </parse>
    </filter>

    # Route FTGO service logs to dedicated index
    <match kubernetes.**>
      @type elasticsearch
      host elasticsearch.logging.svc.cluster.local
      port 9200
      logstash_format true
      logstash_prefix ftgo-logs
      logstash_dateformat %Y.%m.%d
      include_tag_key true
      tag_key fluentd_tag
      <buffer>
        @type file
        path /var/log/fluentd-buffers/ftgo
        flush_mode interval
        flush_interval 5s
        chunk_limit_size 8m
        total_limit_size 2g
        overflow_action block
        retry_max_interval 30
        retry_forever true
      </buffer>
    </match>
