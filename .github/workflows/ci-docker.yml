# ---------------------------------------------------------------------------
# CI — Docker Build, Push & Scan
# ---------------------------------------------------------------------------
# Builds multi-stage Docker images for each FTGO microservice, pushes to
# GitHub Container Registry on merge, and runs Trivy vulnerability scanning.
#
# Image tagging convention:  <service>:<version>-<git-sha-short>
# Example:  ghcr.io/mbatchelor81/ftgo-consumer-service:0.0.1-a1b2c3d
# ---------------------------------------------------------------------------

name: CI — Docker Build & Push

on:
  push:
    branches: [main, feat/microservices-migration]
    paths:
      - 'services/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci-docker.yml'
  pull_request:
    branches: [main, feat/microservices-migration]
    paths:
      - 'services/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci-docker.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  VERSION: 0.0.1

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # -------------------------------------------------------------------------
  # Build, push, and scan each microservice image
  # -------------------------------------------------------------------------
  docker:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ftgo-consumer-service
            dockerfile: services/ftgo-consumer-service/docker/Dockerfile
          - service: ftgo-restaurant-service
            dockerfile: services/ftgo-restaurant-service/docker/Dockerfile
          - service: ftgo-order-service
            dockerfile: services/ftgo-order-service/docker/Dockerfile
          - service: ftgo-courier-service
            dockerfile: services/ftgo-courier-service/docker/Dockerfile
          - service: ftgo-api-gateway
            dockerfile: services/ftgo-api-gateway/docker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.IMAGE_PREFIX }}/${{ matrix.service }}"
          TAGS="${IMAGE}:${{ env.VERSION }}-${SHA_SHORT}"

          # Add 'latest' tag on pushes to main
          if [[ "${{ github.ref_name }}" == "main" && "${{ github.event_name }}" == "push" ]]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "primary=${IMAGE}:${{ env.VERSION }}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.primary }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'

      - name: Trivy SARIF report
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.primary }}
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'

      - name: Upload Trivy SARIF to GitHub Security
        if: success() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.service }}.sarif'
          category: 'trivy-${{ matrix.service }}'

  # -------------------------------------------------------------------------
  # Image cleanup — prune untagged and old images from GHCR
  # -------------------------------------------------------------------------
  cleanup:
    name: Cleanup old images
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ftgo-consumer-service
          - ftgo-restaurant-service
          - ftgo-order-service
          - ftgo-courier-service
          - ftgo-api-gateway
    permissions:
      packages: write
    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
