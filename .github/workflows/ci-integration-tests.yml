# ---------------------------------------------------------------------------
# CI — Integration Tests (with MySQL)
# ---------------------------------------------------------------------------
# Runs integration tests that require a database. Uses MySQL service
# container to validate JPA/Flyway migrations and repository queries.
# ---------------------------------------------------------------------------
name: CI — Integration Tests

on:
  workflow_call:
  push:
    branches: [main, feat/microservices-migration]
    paths:
      - 'services/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci-integration-tests.yml'
  pull_request:
    branches: [main, feat/microservices-migration]
    paths:
      - 'services/**'
      - 'gradle/**'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci-integration-tests.yml'

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: ftgo_test
          MYSQL_USER: ftgo
          MYSQL_PASSWORD: ftgo_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: ':services:ftgo-consumer-service', name: 'ftgo-consumer-service' }
          - { path: ':services:ftgo-restaurant-service', name: 'ftgo-restaurant-service' }
          - { path: ':services:ftgo-order-service', name: 'ftgo-order-service' }
          - { path: ':services:ftgo-courier-service', name: 'ftgo-courier-service' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Run integration tests — ${{ matrix.service.name }}
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ftgo_test
          SPRING_DATASOURCE_USERNAME: ftgo
          SPRING_DATASOURCE_PASSWORD: ftgo_password
          SPRING_PROFILES_ACTIVE: integration-test
        run: |
          ./gradlew \
            "${{ matrix.service.path }}:test" \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck \
            --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.service.name }}
          path: |
            services/${{ matrix.service.name }}/build/test-results/
            services/${{ matrix.service.name }}/build/reports/test/
          retention-days: 14

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage-${{ matrix.service.name }}
          path: |
            services/${{ matrix.service.name }}/build/reports/jacoco/
          retention-days: 14

  integration-summary:
    name: Integration Test Summary
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: integration-test-results-*
          path: test-results/

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: 'test-results/**/TEST-*.xml'
          check_name: 'Integration Test Results'
          comment_mode: 'off'
