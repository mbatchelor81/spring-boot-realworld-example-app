name: Java CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - '**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17 (Gradle runtime)
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Set up JDK 21 (toolchain target)
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '21'
    - name: Set JAVA_HOME to JDK 17 for Gradle
      run: echo "JAVA_HOME=${{ env.JAVA_HOME_17_X64 }}" >> $GITHUB_ENV
    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Test with Gradle
      run: ./gradlew clean test -x jacocoTestCoverageVerification
