# ---------------------------------------------------------------------------
# Reusable CI workflow for FTGO microservices
# ---------------------------------------------------------------------------
# Called by per-service workflows. Builds, tests, and uploads reports for a
# single Gradle sub-project under services/.
# ---------------------------------------------------------------------------
name: Reusable Service Build

on:
  workflow_call:
    inputs:
      service-path:
        description: 'Gradle project path, e.g. :services:ftgo-consumer-service'
        required: true
        type: string
      service-name:
        description: 'Human-readable service name for artifact uploads'
        required: true
        type: string

jobs:
  build:
    name: Build & Test — ${{ inputs.service-name }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build & Test
        env:
          SERVICE_PATH: ${{ inputs.service-path }}
        run: |
          ./gradlew \
            "${SERVICE_PATH}:clean" \
            "${SERVICE_PATH}:build" \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck

      - name: Run quality checks (Checkstyle, PMD, SpotBugs)
        if: always()
        env:
          SERVICE_PATH: ${{ inputs.service-path }}
        run: |
          ./gradlew \
            "${SERVICE_PATH}:checkstyleMain" \
            "${SERVICE_PATH}:pmdMain" \
            "${SERVICE_PATH}:spotbugsMain" \
            -x spotlessCheck \
            --continue || true

      - name: Generate JaCoCo coverage report
        if: always()
        env:
          SERVICE_PATH: ${{ inputs.service-path }}
        run: |
          ./gradlew \
            "${SERVICE_PATH}:jacocoTestReport" \
            -x spotlessCheck || true

      - name: Upload test and quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.service-name }}
          path: |
            services/${{ inputs.service-name }}/build/reports/tests/
            services/${{ inputs.service-name }}/build/test-results/
            services/${{ inputs.service-name }}/build/reports/checkstyle/
            services/${{ inputs.service-name }}/build/reports/pmd/
            services/${{ inputs.service-name }}/build/reports/spotbugs/
            services/${{ inputs.service-name }}/build/reports/jacoco/
          retention-days: 14
