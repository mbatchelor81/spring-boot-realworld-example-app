# ---------------------------------------------------------------------------
# Quality Gate CI — Static Analysis & Coverage
# ---------------------------------------------------------------------------
# Runs Checkstyle, PMD, SpotBugs, JaCoCo, and SonarQube analysis on every
# push and pull request. Quality gate failures block PR merge once services
# adopt ftgo.quality-conventions via ftgo.java-conventions.
#
# During migration: static analysis tasks only exist on subprojects that
# apply the convention plugins. Steps that invoke those tasks use || true
# until services are migrated. The test step always enforces failures.
# ---------------------------------------------------------------------------
name: Quality Gate

on:
  push:
    branches:
      - 'feat/microservices-migration'
      - 'devin/**'
  pull_request:
    branches:
      - 'feat/microservices-migration'

jobs:
  quality-gate:
    name: Static Analysis & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube blame data

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-quality-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-quality-
            ${{ runner.os }}-gradle-

      - name: Build all modules
        run: |
          ./gradlew clean build \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck \
            --continue

      - name: Run static analysis (Checkstyle, PMD, SpotBugs)
        run: |
          # Static analysis tasks only exist on subprojects applying
          # ftgo.quality-conventions. Tolerates task-not-found until
          # services are migrated — remove || true once adopted.
          ./gradlew checkstyleMain pmdMain spotbugsMain \
            -x spotlessCheck \
            --continue || true

      - name: Run tests
        run: |
          ./gradlew test \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck

      - name: Generate JaCoCo reports
        if: always()
        run: |
          # Root project's jacocoTestReport finalizedBy
          # jacocoTestCoverageVerification — must exclude it here.
          ./gradlew jacocoTestReport \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck \
            --continue || true

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            services/*/build/reports/checkstyle/
            services/*/build/reports/pmd/
            services/*/build/reports/spotbugs/
            services/*/build/reports/jacoco/
            services/*/build/reports/tests/
            build/reports/jacoco/
            build/reports/tests/
          retention-days: 14

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-sonar-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-sonar-
            ${{ runner.os }}-gradle-

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and test
        run: |
          ./gradlew clean build \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck \
            --continue

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            ./gradlew sonar \
              -Dsonar.projectKey=mbatchelor81_spring-boot-realworld-example-app \
              -Dsonar.organization=mbatchelor81 \
              -Dsonar.host.url=${SONAR_HOST_URL:-https://sonarcloud.io} \
              -Dsonar.token=$SONAR_TOKEN \
              -Dsonar.java.coveragePlugin=jacoco \
              -Dsonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml \
              -Dsonar.java.checkstyle.reportPaths=**/build/reports/checkstyle/main.xml \
              -Dsonar.java.pmd.reportPaths=**/build/reports/pmd/main.xml \
              -Dsonar.java.spotbugs.reportPaths=**/build/reports/spotbugs/main.xml \
              -Dsonar.exclusions=**/build/generated/**,**/test/** \
              || echo "::warning::SonarQube analysis failed — check SONAR_TOKEN and plugin configuration"
          else
            echo "::warning::SONAR_TOKEN not configured — skipping SonarQube analysis"
            echo "Configure SONAR_TOKEN in repository secrets to enable SonarQube quality gate."
          fi
