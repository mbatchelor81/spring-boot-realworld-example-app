# ---------------------------------------------------------------------------
# CI — E2E Tests (Full Service Stack)
# ---------------------------------------------------------------------------
# Runs end-to-end tests against the full Docker Compose service stack.
# Validates cross-service interactions and API contracts.
# ---------------------------------------------------------------------------
name: CI — E2E Tests

on:
  workflow_call:

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build all services
        run: |
          ./gradlew clean assemble \
            -x jacocoTestCoverageVerification \
            -x spotlessCheck \
            -x test

      - name: Start service stack
        run: |
          docker compose up -d \
            ftgo-consumer-service \
            ftgo-restaurant-service \
            ftgo-order-service \
            ftgo-courier-service

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          services=("8081" "8082" "8083" "8084")
          for port in "${services[@]}"; do
            echo "Checking service on port $port..."
            retries=30
            until curl -sf "http://localhost:$port/actuator/health" > /dev/null 2>&1; do
              retries=$((retries - 1))
              if [ $retries -le 0 ]; then
                echo "Service on port $port failed to start"
                docker compose logs
                exit 1
              fi
              echo "  Waiting... ($retries retries left)"
              sleep 5
            done
            echo "  Service on port $port is healthy"
          done

      - name: Run E2E smoke tests
        run: |
          echo "=== Consumer Service ==="
          curl -sf http://localhost:8081/actuator/health | python3 -m json.tool

          echo "=== Restaurant Service ==="
          curl -sf http://localhost:8082/actuator/health | python3 -m json.tool

          echo "=== Order Service ==="
          curl -sf http://localhost:8083/actuator/health | python3 -m json.tool

          echo "=== Courier Service ==="
          curl -sf http://localhost:8084/actuator/health | python3 -m json.tool

      - name: Collect service logs
        if: always()
        run: |
          mkdir -p e2e-logs
          docker compose logs --no-color > e2e-logs/docker-compose.log 2>&1

      - name: Stop service stack
        if: always()
        run: docker compose down -v

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: e2e-logs/
          retention-days: 14
