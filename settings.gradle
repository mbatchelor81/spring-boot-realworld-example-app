pluginManagement {
    // Convention plugins for microservices (Spring Boot 3.x / Java 17+).
    // The monolith root project does NOT apply these; it keeps its own
    // Spring Boot 2.6.3 declarations in build.gradle.
    includeBuild 'gradle/plugins'

    plugins {
        id 'org.springframework.boot' version '2.6.3'
        id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    }
}

rootProject.name = 'spring-boot-realworld-example-app'

// ---------------------------------------------------------------------------
// Shared libraries
// ---------------------------------------------------------------------------
include 'services:ftgo-common'
include 'services:ftgo-common-jpa'
include 'services:ftgo-domain'
include 'services:ftgo-security-lib'
include 'services:ftgo-openapi-lib'
include 'services:ftgo-tracing-lib'

// ---------------------------------------------------------------------------
// Service API modules (events, commands — consumed by other services)
// ---------------------------------------------------------------------------
include 'services:ftgo-consumer-service-api'
include 'services:ftgo-restaurant-service-api'
include 'services:ftgo-order-service-api'
include 'services:ftgo-courier-service-api'

// ---------------------------------------------------------------------------
// Service implementation modules (Spring Boot applications)
// ---------------------------------------------------------------------------
include 'services:ftgo-consumer-service'
include 'services:ftgo-restaurant-service'
include 'services:ftgo-order-service'
include 'services:ftgo-courier-service'
