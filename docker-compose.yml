version: "3.8"

# ---------------------------------------------------------------------------
# FTGO Platform — Local Development Compose
# ---------------------------------------------------------------------------
# Usage:
#   docker compose up --build          Build from source and start all services
#   docker compose up                  Pull pre-built images from GHCR and start
#   docker compose up ftgo-consumer-service   Start a single service
# ---------------------------------------------------------------------------

# NOTE: YAML merge (<<:) replaces keys — if a service overrides 'environment',
# it must re-include SPRING_PROFILES_ACTIVE=docker in its own list.
x-service-defaults: &service-defaults
  restart: unless-stopped
  environment:
    - SPRING_PROFILES_ACTIVE=docker

services:
  # ---------------------------------------------------------------------------
  # FTGO Microservices
  # ---------------------------------------------------------------------------
  ftgo-consumer-service:
    <<: *service-defaults
    image: ghcr.io/mbatchelor81/ftgo-consumer-service:latest
    build:
      context: .
      dockerfile: services/ftgo-consumer-service/docker/Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ftgo-restaurant-service:
    <<: *service-defaults
    image: ghcr.io/mbatchelor81/ftgo-restaurant-service:latest
    build:
      context: .
      dockerfile: services/ftgo-restaurant-service/docker/Dockerfile
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ftgo-order-service:
    <<: *service-defaults
    image: ghcr.io/mbatchelor81/ftgo-order-service:latest
    build:
      context: .
      dockerfile: services/ftgo-order-service/docker/Dockerfile
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ftgo-courier-service:
    <<: *service-defaults
    image: ghcr.io/mbatchelor81/ftgo-courier-service:latest
    build:
      context: .
      dockerfile: services/ftgo-courier-service/docker/Dockerfile
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      - ftgo-consumer-service
      - ftgo-restaurant-service
      - ftgo-order-service
      - ftgo-courier-service

  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
