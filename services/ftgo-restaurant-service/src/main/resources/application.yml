server:
  port: 8082

spring:
  application:
    name: ftgo-restaurant-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ftgo:
  openapi:
    title: Restaurant Service API
    description: Manages restaurant onboarding, menus, and order acceptance
    version: 1.0.0
    server-url: http://localhost:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
