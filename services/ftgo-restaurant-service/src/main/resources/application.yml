server:
  port: 8082

spring:
  application:
    name: ftgo-restaurant-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

ftgo:
  security:
    public-paths:
      - /actuator/health
      - /actuator/info
    cors:
      allowed-origins:
        - "*"
  openapi:
    title: Restaurant Service API
    description: Manages restaurant onboarding, menus, and order acceptance
    version: 1.0.0
    server-url: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
