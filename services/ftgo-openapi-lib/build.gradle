plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'com.ftgo'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:2.6.3'
    }
}

dependencies {
    // SpringDoc OpenAPI 3 (1.7.x for Spring Boot 2.x; upgrade to
    // springdoc-openapi-starter-webmvc-ui 2.5.0 when services migrate
    // to Spring Boot 3.x — see gradle/libs.versions.toml)
    api 'org.springdoc:springdoc-openapi-ui:1.7.0'
    api 'org.springdoc:springdoc-openapi-common:1.7.0'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-context'
}
