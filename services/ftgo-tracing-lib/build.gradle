plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

group = 'com.ftgo'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:2.6.3'
    }
}

dependencies {
    api 'io.micrometer:micrometer-tracing-bridge-brave:1.2.5'
    api 'io.zipkin.reporter2:zipkin-reporter-brave:2.17.2'
    api 'io.zipkin.reporter2:zipkin-sender-urlconnection:2.17.2'
    api 'io.zipkin.brave:brave-context-slf4j:5.16.0'
    api 'io.zipkin.brave:brave-instrumentation-http:5.16.0'

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-webmvc'
    implementation 'javax.servlet:javax.servlet-api:4.0.1'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}
