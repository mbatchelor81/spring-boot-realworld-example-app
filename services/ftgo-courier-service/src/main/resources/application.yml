server:
  port: 8084

spring:
  application:
    name: ftgo-courier-service
  datasource:
    url: jdbc:h2:mem:ftgo_courier_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

ftgo:
  security:
    public-paths:
      - /actuator/health
      - /actuator/info
    cors:
      allowed-origins:
        - "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

ftgo:
  openapi:
    title: Courier Service API
    description: Manages courier registration, availability, and delivery plans
    version: 1.0.0
    server-url: http://localhost:8084

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
