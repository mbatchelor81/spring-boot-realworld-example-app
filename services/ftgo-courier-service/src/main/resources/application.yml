server:
  port: 8084

spring:
  application:
    name: ftgo-courier-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ftgo:
  openapi:
    title: Courier Service API
    description: Manages courier registration, availability, and delivery plans
    version: 1.0.0
    server-url: http://localhost:8084

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
