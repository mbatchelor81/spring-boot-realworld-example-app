server:
  port: 8081

spring:
  application:
    name: ftgo-consumer-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

ftgo:
  security:
    public-paths:
      - /actuator/health
      - /actuator/info
    cors:
      allowed-origins:
        - "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
