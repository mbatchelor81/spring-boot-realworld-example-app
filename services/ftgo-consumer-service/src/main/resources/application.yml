server:
  port: 8081

spring:
  application:
    name: ftgo-consumer-service
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ftgo:
  openapi:
    title: Consumer Service API
    description: Manages consumer registration, profiles, and payment methods
    version: 1.0.0
    server-url: http://localhost:8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
