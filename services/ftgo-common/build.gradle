plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
}

group = 'com.ftgo'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

repositories {
    mavenCentral()
}

dependencies {
    api 'javax.persistence:javax.persistence-api:2.2'
    api 'javax.validation:validation-api:2.0.1.Final'
    api 'commons-lang:commons-lang:2.6'
    api 'com.fasterxml.jackson.core:jackson-databind:2.13.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.1'

    implementation 'org.springframework:spring-context:5.3.15'
    implementation 'org.springframework:spring-beans:5.3.15'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:2.6.3'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.slf4j:slf4j-api:1.7.36'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.2'
}

jacoco {
    toolVersion = '0.8.12'
}

test {
    useJUnitPlatform()

    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1

    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions true
        showCauses true
        showStackTraces true
    }

    reports {
        junitXml.required = true
        html.required = true
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.ftgo'
            artifactId = 'ftgo-common'
            version = '1.0.0'
        }
    }
    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repo')
        }
    }
}
